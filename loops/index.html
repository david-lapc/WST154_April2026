        let nums = [4, 2, 7, 1, 3, 8, 5, 6, 9, 0];
        //    [2,4,1,7,1,3,5,6,8,0,9] 

        // bubbleSort with for loop
        // Bubble sort is a simple sorting algorithm that repeatedly steps through the list, 
        // compares adjacent elements and swaps them if they are in the wrong order.
        // On of N complexity for bubble sort is O(n^2) because in the worst case, 
        // it requires two nested loops to compare and swap elements. 
        // The outer loop runs n times, and for each iteration of the outer loop, 
        // the inner loop also runs n times, resulting in n * n = n^2 comparisons and swaps.
        function bubbleSort(array) {
            for (let i = 0; i < array.length; i++) {
                for (let j = 0; j < array.length - 1; j++) {
                    if (array[j] > array[j + 1]) {
                        // let temp = array[j]
                        // array[j] = array[j + 1]
                        // array[j + 1] = temp; or use the destructuring assignment syntax to swap the elements in one line
                        [array[j], array[j + 1]] = [array[j + 1], array[j]]
                    }
                }
            }
            return array;
        }

        console.log(bubbleSort(nums))
